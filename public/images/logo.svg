<?xml version="1.0" encoding="UTF-8"?>
<!-- StudyHive team logo: original artwork drawn by our team (hexagon honeycomb cell with an open book and a bee). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="StudyHive logo">
  <!-- Outer hexagon (honeycomb cell) -->
  <polygon points="60,6 106,33 106,87 60,114 14,87 14,33" fill="#FFC83D" stroke="#2B2D42" stroke-width="5" stroke-linejoin="round"/>
  <!-- Open book -->
  <path d="M30 50 Q45 44 60 52 Q75 44 90 50 L90 88 Q75 82 60 90 Q45 82 30 88 Z" fill="#FFFFFF" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
  <line x1="60" y1="52" x2="60" y2="90" stroke="#2B2D42" stroke-width="4"/>
  <!-- Text lines on the book pages -->
  <line x1="37" y1="60" x2="53" y2="63" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  <line x1="37" y1="70" x2="53" y2="73" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  <line x1="67" y1="63" x2="83" y2="60" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  <line x1="67" y1="73" x2="83" y2="70" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
  <!-- Little bee above the book -->
  <ellipse cx="60" cy="30" rx="11" ry="8" fill="#2B2D42"/>
  <rect x="55" y="22" width="4" height="16" fill="#FFC83D"/>
  <rect x="62" y="22" width="4" height="16" fill="#FFC83D"/>
  <ellipse cx="52" cy="21" rx="6" ry="4" fill="#BFE6FF" stroke="#2B2D42" stroke-width="2"/>
  <ellipse cx="68" cy="21" rx="6" ry="4" fill="#BFE6FF" stroke="#2B2D42" stroke-width="2"/>
</svg>
